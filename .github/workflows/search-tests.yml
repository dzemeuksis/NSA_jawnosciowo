name: Search conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-search.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r tools/requirements-search.txt
      - run: npm ci
      - run: npm test
      - run: python tools/build_bm25.py
      - run: git diff --exit-code -- data/bm25.json data/bm25-unicode.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
